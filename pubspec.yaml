name: phimflux
description: "PhimFlux - Smart TV & Mobile Movie Streaming Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  video_player: ^2.8.2
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  web: ^1.1.1
  pointer_interceptor: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
